[package]
name = "eridiffusion-cli"
version = "0.1.0"
edition = "2021"
description = "EriDiffusion Rust port — CLI"

[[bin]]
name = "eridiffusion"
path = "src/main.rs"

[[bin]]
name = "prepare_l2p"
path = "src/bin/prepare_l2p.rs"

[[bin]]
name = "train_l2p"
path = "src/bin/train_l2p.rs"

[dependencies]
eridiffusion-core = { path = "../eridiffusion-core" }
# inference-flame is sibling to EriDiffusion-v2 in the EriDiffusion repo.
# Pulled in by the A0.5 asymflow teacher-parity smoke binary so we can call
# the verified Klein 9B + AsymFlux2 wrapper without duplicating ~800 LOC.
inference-flame = { path = "../../../inference-flame" }
flame-core = { workspace = true }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
log = "0.4"
env_logger = "0.10"
image = "0.24"
md5 = "0.7"
rand = "0.8"
rand_distr = "0.4"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
serde_json = "1"
safetensors = { workspace = true }
cudarc = { workspace = true }

[features]
# Gate-on Stage 6a (2026-05-30): autograd_v2 is now a DEFAULT feature so the
# v2 `backward_v2()` bridge compiles into the normal build. Klein routes
# through v2 by default (proven within BF16 tolerance vs v3); other trainers
# still default to v3 unless they pass --use-autograd-v2. v3 stays compiled
# and reachable (Klein: --use-autograd-v3). Use --no-default-features to
# exclude the v2 bridge entirely.
default = ["autograd_v2"]
autograd_v2 = ["flame-core/autograd_v2"]
